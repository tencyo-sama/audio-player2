<!DOCTYPE html>
<html lang="ja" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Audio/Video Player</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-dark text-light">

    <!-- Navbar / Header -->
    <nav class="navbar navbar-dark bg-black border-bottom border-secondary fixed-top">
        <div class="container-fluid d-flex flex-wrap align-items-center gap-2">
            <span class="navbar-brand mb-0 h1 text-truncate" style="font-size: 1.1rem;">
                <i class="bi bi-music-note-beamed text-primary me-2"></i>ギターの練習するやつ
            </span>
            <div class="d-flex align-items-center flex-grow-1 gap-2">
                <!-- Repository Video Selector -->
                <select id="videoSelector"
                    class="form-select form-select-sm border-secondary bg-dark text-light w-auto">
                    <option value="">-- Load from list --</option>
                </select>
                <!-- Local File Input -->
                <input class="form-control form-control-sm border-secondary bg-dark text-light" type="file"
                    id="fileInput" accept="audio/*,video/mp4,video/webm">
            </div>
        </div>
    </nav>

    <!-- Main Content Area (Visualizer or Video) -->
    <main id="mediaContainer" class="d-flex justify-content-center align-items-center bg-black position-relative w-100">
        <!-- Message for NO FILE -->
        <div id="noFileMsg" class="text-center text-secondary">
            <i class="bi bi-file-earmark-music display-1"></i>
            <p class="mt-3">Tap "Choose File" or select from list to load Media</p>
        </div>

        <!-- Audio Visualizer -->
        <div id="audioVisualizer" class="text-center text-primary d-none">
            <i class="bi bi-soundwave display-1" id="musicIcon"></i>
        </div>

        <!-- Video Player -->
        <video id="videoPlayer" class="w-100 h-100 d-none" playsinline disablepictureinpicture
            controlslist="nodownload noplaybackrate"></video>

        <!-- Fullscreen Toggle Button (overlay) -->
        <button id="btnFullscreenToggle" class="btn btn-outline-light position-absolute d-none"
            style="top: 10px; right: 10px; z-index: 20; border: none; background: rgba(0,0,0,0.5); font-size: 1.2rem;">
            <i class="bi bi-arrows-fullscreen"></i>
        </button>

        <!-- Overlay: Loop Info (A-B) -->
        <div id="loopOverlay" class="position-absolute px-3 py-1 bg-dark bg-opacity-75 rounded-pill d-none"
            style="top: 10px; left: 10px; z-index: 10; font-size: 0.85rem; border: 1px solid #0dcaf0;">
            <i class="bi bi-arrow-repeat text-info me-1"></i>
            <span id="loopA" class="fw-bold">--:--</span> - <span id="loopB" class="fw-bold">--:--</span>
            <span id="loopBarInfo" class="text-info ms-1 small"></span>
        </div>
    </main>

    <!-- Controls Area (Fixed Bottom for Mobile) -->
    <footer id="controlsArea" class="bg-black border-top border-secondary fixed-bottom px-1 py-1 overflow-y-auto"
        style="max-height: 55vh;">

        <!-- Seek Slider -->
        <div class="px-2 mt-1 mb-1">
            <input type="range" class="form-range" id="seekSlider" value="0" min="0" max="100" step="0.1" disabled style="height: 0.5rem;" title="Seek">
        </div>

        <!-- 1. Primary Transport Controls (Play, Stop, Skips, & Time) -->
        <div class="d-flex justify-content-between align-items-center mb-1 px-2">
            <div class="text-secondary" style="font-size: 0.75rem; font-family: monospace;">
                <span id="timeCurrent">00:00.0</span> / <span id="timeTotal">00:00.0</span>
            </div>
            <div class="d-flex justify-content-center align-items-center gap-2">
                <button
                    class="btn btn-outline-light rounded-circle d-flex justify-content-center align-items-center control-btn-sm"
                    id="btnSkipBack" title="-5s">
                    <i class="bi bi-rewind-fill"></i>
                </button>
                <button
                    class="btn btn-primary rounded-circle shadow-lg d-flex justify-content-center align-items-center play-btn-sm"
                    id="btnPlayPause" disabled>
                    <i class="bi bi-play-fill" id="iconPlay"></i>
                </button>
                <button
                    class="btn btn-outline-light rounded-circle d-flex justify-content-center align-items-center control-btn-sm"
                    id="btnSkipFwd" title="+5s">
                    <i class="bi bi-fast-forward-fill"></i>
                </button>
            </div>
            <!-- Toggle Collapsible Settings (BPM / Bar Snap / Sync) -->
            <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 py-1 px-2"
                id="btnToggleSettings" title="BPM・小節・音ズレ設定を開閉" style="font-size: 0.75rem;">
                <i class="bi bi-sliders"></i>
                <span id="labelToggleSettings">設定</span>
                <i class="bi bi-chevron-up" id="iconToggleSettings"></i>
            </button>
        </div>

        <!-- 2. A-B Loop Controls -->
        <div class="card bg-dark border-secondary mb-1">
            <div class="card-body p-1 px-2 d-flex flex-wrap gap-1 justify-content-between align-items-center">
                <button class="btn btn-sm btn-outline-secondary d-flex justify-content-center align-items-center"
                    id="btnLoopMode" title="Loop Mode" style="width: 36px;">
                    <i class="bi bi-repeat" id="iconLoopMode"></i>
                </button>
                <!-- Bar Snap Toggle Button -->
                <button class="btn btn-sm btn-outline-info active d-flex align-items-center gap-1 px-2"
                    id="btnSnapToggle" title="小節スナップ ON/OFF" style="font-size: 0.75rem;">
                    <i class="bi bi-magnet-fill"></i>
                    <span>小節</span>
                    <span id="badgeBpm" class="badge bg-black text-info border border-info ms-1" style="font-family: monospace;">--</span>
                </button>
                <div class="btn-group flex-grow-1" role="group">
                    <button class="btn btn-sm btn-outline-info" id="btnSetA">Set A</button>
                    <button class="btn btn-sm btn-outline-info" id="btnSetB">Set B</button>
                </div>
                <button class="btn btn-sm btn-outline-danger px-2 border-0" id="btnClearLoop" disabled title="Clear Loop"><i
                        class="bi bi-x-lg"></i></button>
            </div>
        </div>

        <!-- 3. Tempo and Pitch (Side by side) -->
        <div class="row g-2 mb-1">
            <!-- Tempo Column -->
            <div class="col-6">
                <div class="card bg-dark border-secondary h-100">
                    <div class="card-body p-1 text-center">
                        <div class="text-secondary small mb-1"><i class="bi bi-speedometer2 me-1"></i>Tempo</div>
                        <div class="d-flex justify-content-between align-items-center gap-1">
                            <button class="btn btn-sm btn-secondary p-1" id="btnTempoDown"
                                style="width: 32px;">-</button>
                            <span class="text-light fw-bold flex-grow-1" id="valTempo"
                                style="font-family: monospace; font-size: 0.9rem;">100%</span>
                            <button class="btn btn-sm btn-secondary p-1" id="btnTempoUp" style="width: 32px;">+</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Pitch Column -->
            <div class="col-6">
                <div class="card bg-dark border-secondary h-100">
                    <div class="card-body p-1 text-center">
                        <div class="text-secondary small mb-1"><i class="bi bi-music-note me-1"></i>Pitch</div>
                        <div class="d-flex justify-content-between align-items-center gap-1">
                            <button class="btn btn-sm btn-secondary p-1" id="btnPitchDown"
                                style="width: 32px;">♭</button>
                            <span class="text-light fw-bold flex-grow-1" id="valPitch"
                                style="font-family: monospace; font-size: 0.9rem;">0 st</span>
                            <button class="btn btn-sm btn-secondary p-1" id="btnPitchUp" style="width: 32px;">#</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. Collapsible Settings Drawer (BPM / Bar Snap Fine-Tuning & A/V Sync Offset) -->
        <div id="collapsibleSettings" class="d-none">
            <!-- 4-A. BPM & Bar Snap Controls -->
            <div class="card bg-dark border-secondary mb-1">
                <div class="card-body p-1 px-2">
                    <!-- Row 1: BPM, Time Signature, Tap & Auto-Detect -->
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-1 mb-1">
                        <div class="d-flex align-items-center gap-1">
                            <span class="text-secondary" style="font-size: 0.75rem;"><i class="bi bi-metronome me-1"></i>BPM</span>
                            <button class="btn btn-sm btn-secondary py-0 px-2" id="btnBpmDown" title="BPM -1">-</button>
                            <input type="number" id="inputBpm" class="form-control form-control-sm bg-black text-light text-center border-secondary py-0 px-1"
                                value="120" min="40" max="240" step="1" style="width: 58px; font-family: monospace; font-size: 0.85rem;">
                            <button class="btn btn-sm btn-secondary py-0 px-2" id="btnBpmUp" title="BPM +1">+</button>
                        </div>
                        <div class="d-flex align-items-center gap-1">
                            <select id="selectTimeSig" class="form-select form-select-sm bg-black text-light border-secondary py-0 px-2"
                                style="width: auto; font-size: 0.75rem;" title="拍子">
                                <option value="4" selected>4/4拍子</option>
                                <option value="3">3/4拍子</option>
                                <option value="2">2/4拍子</option>
                                <option value="6">6/8拍子</option>
                            </select>
                            <button class="btn btn-sm btn-outline-info py-0 px-2" id="btnTapTempo" style="font-size: 0.75rem;" title="曲に合わせて連続タップでBPM設定">Tap</button>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-2" id="btnDetectBpm" style="font-size: 0.75rem;" title="音声からBPMを再解析">再解析</button>
                        </div>
                    </div>
                    <!-- Row 2: Loop Fine-Tune & Bar Navigation -->
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-1 pt-1 border-top border-secondary">
                        <div class="d-flex align-items-center gap-1">
                            <span class="text-secondary" style="font-size: 0.7rem;">位置:</span>
                            <div class="btn-group btn-group-sm" role="group">
                                <button class="btn btn-outline-secondary py-0 px-1" id="btnShiftBeatBack" style="font-size: 0.7rem;" title="ループ位置を1拍前へ">-1拍</button>
                                <button class="btn btn-outline-secondary py-0 px-1" id="btnShiftFineBack" style="font-size: 0.7rem;" title="ループ位置を0.05秒前へ">-0.05s</button>
                                <button class="btn btn-outline-secondary py-0 px-1" id="btnShiftFineFwd" style="font-size: 0.7rem;" title="ループ位置を0.05秒後へ">+0.05s</button>
                                <button class="btn btn-outline-secondary py-0 px-1" id="btnShiftBeatFwd" style="font-size: 0.7rem;" title="ループ位置を1拍後へ">+1拍</button>
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-1">
                            <span class="text-secondary" style="font-size: 0.7rem;">小節:</span>
                            <div class="btn-group btn-group-sm" role="group">
                                <button class="btn btn-outline-info py-0 px-1" id="btnBarMinus" style="font-size: 0.7rem;" title="ループを1小節短くする">-1小節</button>
                                <button class="btn btn-outline-info py-0 px-1" id="btnBarPlus" style="font-size: 0.7rem;" title="ループを1小節長くする">+1小節</button>
                            </div>
                            <div class="btn-group btn-group-sm ms-1" role="group">
                                <button class="btn btn-outline-light py-0 px-1" id="btnPrevSection" style="font-size: 0.7rem;" title="前の小節区間へ移動">◀前</button>
                                <button class="btn btn-outline-light py-0 px-1" id="btnNextSection" style="font-size: 0.7rem;" title="次の小節区間へ移動">次▶</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4-B. Sync Slider -->
            <div class="card bg-dark border-secondary">
                <div class="card-body p-1 px-2">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label mb-0 text-secondary" style="font-size: 0.75rem;"><i
                                class="bi bi-clock-history me-1"></i>A/V Sync Offset</label>
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-light fw-bold" id="valSync"
                                style="font-family: monospace; font-size: 0.8rem;">0.00s</span>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-2" style="font-size: 0.7rem;"
                                id="btnResetSync">Reset</button>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-1">
                        <button class="btn btn-outline-secondary btn-sm py-0 px-2 border-0" id="btnSyncMinus"><i
                                class="bi bi-dash"></i></button>
                        <input type="range" class="form-range flex-grow-1" id="sliderSync" min="-1.0" max="1.0" step="0.01"
                            value="0.0">
                        <button class="btn btn-outline-secondary btn-sm py-0 px-2 border-0" id="btnSyncPlus"><i
                                class="bi bi-plus"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <!-- Bootstrap JS (Optional, but good for tooltips, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SoundTouch JS (Pitch/Tempo algorithm) -->
    <script src="js/soundtouch.js"></script>
    <!-- Main App Logic -->
    <script src="js/app.js"></script>
</body>

</html>
